name: Manim plugin tests

on:
  push:
    branches: [master]
    paths:
      - "manim-polymorph/**"
      - "src/polymorph/**"
      - ".github/workflows/plugin-tests.yml"
  pull_request:
    paths:
      - "manim-polymorph/**"
      - "src/polymorph/**"
      - ".github/workflows/plugin-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config ffmpeg
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e "./manim-polymorph[dev]"
      - name: Run tests
        run: |
          python -m pytest -q
          python -m pytest manim-polymorph/tests -q
      - name: Lint
        run: ruff check manim-polymorph
      - name: Smoke render example scene
        working-directory: manim-polymorph
        run: manim -qm -s examples/demo.py PolymorphDemo
